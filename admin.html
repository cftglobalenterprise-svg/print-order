<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打印订单管理 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E6; --paper-deep:#EDE7D6; --line:#C9BFA8;
    --ink:#221F1A; --ink-soft:#6B6354;
    --stamp:#C1432A; --carbon:#D8A230;
    --paid:#4B7A51; --paid-bg:#E7EFE4;
    --printed:#3D6FA6; --printed-bg:#E4EDF5;
    --collected:#6B6354; --collected-bg:#E8E4D8;
    --wa:#3FA046;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper-deep); color:var(--ink);
    font-family:'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    padding:16px;
  }
  header{
    max-width:900px; margin:0 auto 16px;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  header h1{ font-family:'Inter', sans-serif; font-size:18px; margin:0; }
  header .count{ font-family:'Inter', sans-serif; font-size:12px; color:var(--ink-soft); }

  .filters{
    max-width:900px; margin:0 auto 14px;
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .filters button{
    font-family:'Inter', sans-serif; font-size:12px;
    padding:6px 12px; border:1.3px solid var(--ink); background:transparent;
    color:var(--ink); cursor:pointer;
  }
  .filters button.active{ background:var(--ink); color:var(--paper); }

  .list{ max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }

  .card{
    background:var(--paper); border:1.3px solid var(--ink);
    padding:14px 16px;
  }
  .card.is-collected{ opacity:0.6; }
  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:10px; margin-bottom:8px;
  }
  .oid{ font-family:'Inter', sans-serif; font-size:13px; font-weight:700; }
  .time{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }
  .price{ font-family:'Inter', sans-serif; font-size:18px; font-weight:700; color:var(--stamp); flex-shrink:0; }

  .badges{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom:2px; }

  .spec{ font-size:13px; margin:8px 0; line-height:1.6; }
  .spec b{ font-weight:600; }

  .phone-link{
    font-family:'Inter', sans-serif; font-size:12.5px;
    background:none; border:none; padding:0; cursor:pointer;
    color:var(--wa); text-decoration:underline; text-align:left;
  }
  .phone-none{ font-family:'Inter', sans-serif; font-size:12.5px; color:var(--ink-soft); }

  .file-group{ margin-top:10px; }
  .file-group-title{
    font-family:'Inter', sans-serif; font-size:10.5px;
    color:var(--ink-soft); letter-spacing:0.04em;
    margin-bottom:4px;
  }
  .file-row-line{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 0; border-bottom:1px dashed var(--line);
    gap:8px;
  }
  .file-row-line.downloaded{ opacity:0.55; }
  .file-row-line:last-child{ border-bottom:none; }
  .file-row-line-name{
    font-family:'Inter', sans-serif; font-size:12px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .file-row-line-pages{ color:var(--ink-soft); }
  .dl-check{ color:var(--paid); margin-right:4px; }
  .dl-btn{
    font-family:'Inter', sans-serif; font-size:11.5px;
    background:var(--paper-deep); border:1.3px solid var(--ink);
    padding:4px 9px; cursor:pointer; color:var(--ink); flex-shrink:0;
  }
  .dl-btn:active{ background:var(--ink); color:var(--paper); }
  .dl-btn:disabled{ opacity:0.5; cursor:default; }
  .dl-btn.done{
    background:transparent; border-color:var(--line); color:var(--ink-soft);
  }

  .checklist{
    display:flex; gap:16px; flex-wrap:wrap; align-items:center;
    margin-top:12px; padding-top:10px; border-top:1px solid rgba(201,191,168,0.6);
  }
  .checklist label{
    display:flex; align-items:center; gap:6px;
    font-family:'Inter', sans-serif; font-size:12.5px; cursor:pointer;
  }
  .checklist input[type=checkbox]{
    width:16px; height:16px; accent-color: var(--ink); cursor:pointer;
  }

  .card-actions{
    display:flex; gap:8px; margin-top:10px;
  }
  .receipt-btn, .delete-btn{
    font-family:'Inter', sans-serif; font-size:11.5px;
    padding:6px 10px; border:1.3px solid var(--ink); background:transparent;
    color:var(--ink); cursor:pointer;
  }
  .receipt-btn:active{ background:var(--ink); color:var(--paper); }
  .delete-btn{ border-color:var(--stamp); color:var(--stamp); }
  .delete-btn:active{ background:var(--stamp); color:var(--paper); }

  .badge{
    font-family:'Inter', sans-serif; font-size:11px;
    padding:3px 8px; border-radius:2px; font-weight:600;
  }
  .badge.quick{ background:#F3E3D0; color:var(--stamp); }
  .badge.pay-online{ background:#F3E3D0; color:#B57A17; }
  .badge.pay-store{ background:#F3E3D0; color:#B57A17; }
  .badge.pay-done{ background:var(--paid-bg); color:var(--paid); }
  .badge.printed-badge{ background:var(--printed-bg); color:var(--printed); }
  .badge.collected-badge{ background:var(--collected-bg); color:var(--collected); }

  .empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-family:'Inter', sans-serif; font-size:13px; }

  .gate{
    max-width:320px; margin:120px auto; text-align:center;
  }
  .gate h2{ font-family:'Inter', sans-serif; }
  .gate input{
    width:100%; padding:10px; font-size:16px; text-align:center;
    border:1.3px solid var(--ink); background:var(--paper); margin-bottom:10px;
    letter-spacing:0.2em;
  }
  .gate button{
    width:100%; padding:12px; font-family:'Inter', sans-serif;
    background:var(--ink); color:var(--paper); border:none; cursor:pointer;
  }
  .gate .err{ color:var(--stamp); font-size:12px; margin-top:8px; }
  .hidden{ display:none !important; }

  /* 收据打印区 - 平时藏起来，打印时才出现 */
  #receiptArea{ display:none; }
  @media print{
    @page{ size: A4; margin: 16mm; }
    body *{ visibility:hidden; }
    #receiptArea, #receiptArea *{ visibility:visible; }
    #receiptArea{
      display:block; position:absolute; top:0; left:0; width:100%;
      font-family:'Inter', sans-serif; color:#221F1A;
    }
    #receiptArea .r-center{ text-align:center; }
    #receiptArea .r-brand{ font-size:34px; font-weight:800; letter-spacing:0.01em; margin:0; }
    #receiptArea .r-bizline{ font-size:12px; color:#221F1A; margin-top:6px; }
    #receiptArea .r-line{ border-top:1.5px dashed #C9BFA8; margin:18px 0; }
    #receiptArea .r-line.solid{ border-top:2.5px solid #221F1A; }
    #receiptArea .r-doctype{
      font-size:11px; font-weight:700; letter-spacing:0.18em; color:#221F1A; margin-bottom:4px;
    }
    #receiptArea .r-invno{ font-size:22px; font-weight:800; }
    #receiptArea .r-infogrid{ display:flex; gap:14px; margin:16px 0; }
    #receiptArea .r-infobox{
      flex:1; background:#F2EEE2; padding:12px 14px;
    }
    #receiptArea .r-infobox .r-infolabel{
      font-size:10px; font-weight:700; letter-spacing:0.1em; color:#221F1A; margin-bottom:3px;
    }
    #receiptArea .r-infobox .r-infoval{ font-size:14px; font-weight:700; }
    #receiptArea table.r-items{ width:100%; border-collapse:collapse; margin-top:6px; }
    #receiptArea table.r-items th{
      text-align:left; font-size:10.5px; letter-spacing:0.08em; color:#221F1A;
      border-bottom:2.5px solid #221F1A; padding:0 0 8px;
    }
    #receiptArea table.r-items th.num, #receiptArea table.r-items td.num{ text-align:right; }
    #receiptArea table.r-items td{
      font-size:14px; padding:10px 0; border-bottom:1px solid #C9BFA8;
    }
    #receiptArea table.r-items td.subtotal{ font-weight:700; }
    #receiptArea .r-total-row{
      display:flex; justify-content:space-between; align-items:center;
      margin-top:14px;
    }
    #receiptArea .r-total-label{ font-size:22px; font-weight:800; }
    #receiptArea .r-total-val{ font-size:28px; font-weight:800; color:#C1432A; }
    #receiptArea .r-pay-badge{
      display:inline-block; margin-top:10px;
      background:#221F1A; color:#F5F1E6;
      font-size:11.5px; font-weight:700; letter-spacing:0.06em;
      padding:6px 14px;
    }
    #receiptArea .r-qr-box{
      display:flex; align-items:center; gap:20px;
      border:2px dashed #221F1A; padding:18px 20px; margin-top:24px;
    }
    #receiptArea .r-qr-box img{ width:130px; height:130px; flex-shrink:0; }
    #receiptArea .r-qr-box .r-qr-title{ font-size:15px; font-weight:800; margin-bottom:4px; }
    #receiptArea .r-qr-box .r-qr-text{ font-size:12px; color:#221F1A; line-height:1.5; }
    #receiptArea .r-foot{ text-align:center; margin-top:26px; }
    #receiptArea .r-foot .r-thanks{ font-size:14px; font-weight:800; letter-spacing:0.08em; }
    #receiptArea .r-foot .r-note{ font-size:11px; color:#221F1A; margin-top:6px; }
  }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2>🔒 员工专用</h2>
  <input type="password" id="pin" placeholder="密码 Password">
  <button id="gateBtn">进入</button>
  <div class="err hidden" id="gateErr">PIN 不对</div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>🖨️ 打印订单 ORDERS</h1>
    <span class="count" id="countLabel"></span>
  </header>
  <div class="filters" id="filters">
    <button data-f="all" class="active">全部</button>
    <button data-f="pending">待处理</button>
    <button data-f="printed">已打印待取</button>
    <button data-f="collected">已取件</button>
  </div>
  <div class="list" id="list"></div>
</div>

<div id="receiptArea"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://bkunpzbovsetqdtjlwmf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_-1Hhh1o7Uv4qQNb1NKCKew_7UuG4qpT";
  const ADMIN_PIN = "Choo-1996"; // 密码，之后想改就改这行

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.getElementById("gateBtn").addEventListener("click", tryEnter);
  document.getElementById("pin").addEventListener("keydown", e => { if (e.key === "Enter") tryEnter(); });
  function tryEnter() {
    const val = document.getElementById("pin").value;
    if (val === ADMIN_PIN) {
      sessionStorage.setItem("po_admin_ok", "1");
      document.getElementById("gate").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      loadOrders();
    } else {
      document.getElementById("gateErr").classList.remove("hidden");
    }
  }
  if (sessionStorage.getItem("po_admin_ok") === "1") {
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    loadOrders();
  }

  let orders = [];
  let currentFilter = "all";
  const list = document.getElementById("list");

  const downloadedSet = new Set(JSON.parse(localStorage.getItem("po_downloaded") || "[]"));
  function markDownloaded(url) {
    downloadedSet.add(url);
    localStorage.setItem("po_downloaded", JSON.stringify([...downloadedSet]));
  }

  document.querySelectorAll("#filters button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.f;
      render();
    });
  });

  async function loadOrders() {
    const { data, error } = await sb
      .from("print_orders")
      .select("*")
      .order("created_at", { ascending: false });
    if (error) { alert("加载失败: " + error.message); return; }
    orders = data;
    render();
  }

  // ---- helpers ----
  function rank(o) {
    if (o.collected) return 2;
    if (o.printed) return 1;
    return 0;
  }
  function matchesFilter(o) {
    if (currentFilter === "all") return true;
    if (currentFilter === "pending") return !o.printed && !o.collected;
    if (currentFilter === "printed") return o.printed && !o.collected;
    if (currentFilter === "collected") return !!o.collected;
    return true;
  }
  function categorize(name) {
    const ext = (name.split(".").pop() || "").toLowerCase();
    if (ext === "pdf") return "PDF";
    if (["jpg","jpeg","png","gif","webp","heic"].includes(ext)) return "图片";
    if (["doc","docx"].includes(ext)) return "Word 文档";
    return "其他文件";
  }
  function renderFiles(files) {
    const groups = {};
    (files || []).forEach(f => {
      const cat = categorize(f.name);
      (groups[cat] = groups[cat] || []).push(f);
    });
    const order = ["PDF", "图片", "Word 文档", "其他文件"];
    return order.filter(cat => groups[cat]).map(cat => `
      <div class="file-group">
        <div class="file-group-title">${cat} · ${groups[cat].length}个</div>
        ${groups[cat].map(f => {
          const done = downloadedSet.has(f.url);
          return `
          <div class="file-row-line ${done ? "downloaded" : ""}">
            <span class="file-row-line-name">${done ? '<span class="dl-check">✓</span>' : ''}${f.name} <span class="file-row-line-pages">(${f.pages}页)</span></span>
            <button type="button" class="dl-btn ${done ? "done" : ""}" data-url="${f.url}" data-name="${f.name}">${done ? "↻ 重新下载" : "⬇ 下载"}</button>
          </div>
        `;
        }).join("")}
      </div>
    `).join("");
  }
  function normalizePhone(raw) {
    let digits = raw.replace(/\D/g, "");
    if (digits.startsWith("60")) return digits;
    if (digits.startsWith("0")) return "60" + digits.slice(1);
    return "60" + digits;
  }
  function paymentBadge(o) {
    if (o.paid) return `<span class="badge pay-done">✓ 已收款</span>`;
    if (o.payment_method === "online_claimed") return `<span class="badge pay-online">💳 待核实付款</span>`;
    return `<span class="badge pay-store">🏪 到店付款(未收)</span>`;
  }

  // 店铺信息 —— 地址/营业时间是照你截图里的抄的，不对的话跟我说，改这里就行
  const BIZ = {
    name: "KEDAI 19",
    address: "No 19, Bandar Baru Brinchang, 39100 Brinchang, Pahang",
    phone: "+6011-3335 1400",
    hours: "10:00 AM - 10:00 PM Daily",
    ssm: "202203221872 (NS0273693-A)",
    orderUrl: "https://cftglobalenterprise-svg.github.io/print-order/"
  };

  function buildReceiptHtml(o) {
    const created = new Date(o.created_at);
    const dateStr = created.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
    const timeStr = created.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
    const shortId = o.id.slice(0,8).toUpperCase();
    const invNo = "INV-" + created.toISOString().slice(2,10).replace(/-/g,"") + "-" + shortId.slice(0,6);

    const rate = { A5:{bw:0.50,color:1.00}, A4:{bw:0.50,color:1.00}, A3:{bw:1.00,color:2.00} };
    const coverRate = { A5:3.00, A3:5.00, A4:3.00 };
    const qty = o.total_pages * o.copies;
    const unitPrice = rate[o.paper_size]?.[o.color_mode] || 0;
    const base = unitPrice * qty;
    const cover = o.plastic_cover ? (coverRate[o.paper_size] || 0) * o.copies : 0;

    const colorLabel = o.color_mode === "bw" ? "B&W" : "COLOR";
    const itemRows = `
      <tr>
        <td>${o.paper_size} PRINTING ${colorLabel} · ${o.double_sided ? "Double-sided" : "Single-sided"}</td>
        <td class="num">${qty}</td>
        <td class="num">RM ${unitPrice.toFixed(2)}</td>
        <td class="num subtotal">RM ${base.toFixed(2)}</td>
      </tr>
      ${cover > 0 ? `
      <tr>
        <td>LAMINATION (${o.paper_size})</td>
        <td class="num">${o.copies}</td>
        <td class="num">RM ${(coverRate[o.paper_size] || 0).toFixed(2)}</td>
        <td class="num subtotal">RM ${cover.toFixed(2)}</td>
      </tr>` : ""}
    `;

    const payText = o.paid ? "PAID" : (o.payment_method === "online_claimed" ? "PAID VIA QR (PENDING VERIFICATION)" : "PAY AT STORE (UNPAID)");

    return `
      <div class="r-center">
        <div class="r-brand">${BIZ.name}</div>
        <div class="r-bizline">${BIZ.address}</div>
        <div class="r-bizline">Tel: ${BIZ.phone} &nbsp;|&nbsp; Hours: ${BIZ.hours}</div>
        <div class="r-bizline">KEDAI 19 adalah nama perniagaan dimiliki oleh CFT GLOBAL ENTERPRISE</div>
        <div class="r-bizline">SSM No: ${BIZ.ssm}</div>
      </div>

      <div class="r-line"></div>

      <div class="r-center">
        <div class="r-doctype">OFFICIAL RECEIPT</div>
        <div class="r-invno">${invNo}</div>
      </div>

      <div class="r-line solid"></div>

      <div class="r-infogrid">
        <div class="r-infobox">
          <div class="r-infolabel">DATE &amp; TIME</div>
          <div class="r-infoval">${dateStr} at ${timeStr}</div>
        </div>
        <div class="r-infobox">
          <div class="r-infolabel">CUSTOMER</div>
          <div class="r-infoval">${o.customer_phone || "Walk-in Customer"}</div>
        </div>
      </div>

      <table class="r-items">
        <thead>
          <tr>
            <th>ITEM</th>
            <th class="num">QTY</th>
            <th class="num">UNIT PRICE</th>
            <th class="num">SUBTOTAL</th>
          </tr>
        </thead>
        <tbody>${itemRows}</tbody>
      </table>

      <div class="r-line"></div>

      <div class="r-total-row">
        <div class="r-total-label">TOTAL AMOUNT</div>
        <div class="r-total-val">RM ${Number(o.price).toFixed(2)}</div>
      </div>
      <div class="r-pay-badge">${payText}</div>

      <div class="r-qr-box">
        <img src="assets/order-qr.png" alt="Order QR">
        <div>
          <div class="r-qr-title">PRINTING &amp; PHOTOSTAT SERVICES</div>
          <div class="r-qr-text">Need printing, photostat or scanning next time?<br>Scan this QR to order online.<br><b>${BIZ.orderUrl.replace("https://","")}</b></div>
        </div>
      </div>

      <div class="r-line"></div>

      <div class="r-foot">
        <div class="r-thanks">THANK YOU!</div>
        <div class="r-note">This is a computer-generated receipt. No signature required.</div>
        <div class="r-note">SSM No: ${BIZ.ssm}</div>
      </div>
    `;
  }

  function render() {
    const filtered = orders.filter(matchesFilter).sort((a, b) => {
      const r = rank(a) - rank(b);
      if (r !== 0) return r;
      return new Date(b.created_at) - new Date(a.created_at);
    });
    document.getElementById("countLabel").textContent = `共 ${filtered.length} 单`;

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty">暂时没有订单</div>`;
      return;
    }

    list.innerHTML = filtered.map(o => {
      const t = new Date(o.created_at).toLocaleString("zh-CN", { dateStyle: "short", timeStyle: "short" });
      const shortId = o.id.slice(0,8).toUpperCase();
      return `
        <div class="card ${o.collected ? "is-collected" : ""}">
          <div class="card-top">
            <div>
              <span class="oid">#${shortId}</span>
              <div class="badges">
                ${paymentBadge(o)}
                ${o.printed ? '<span class="badge printed-badge">🖨 已打印</span>' : ''}
                ${o.collected ? '<span class="badge collected-badge">📦 已取件</span>' : ''}
                ${o.notes ? '<span class="badge quick">⚡ 待确认</span>' : ''}
              </div>
              <div class="time">${t}</div>
            </div>
            <div class="price">RM ${Number(o.price).toFixed(2)}</div>
          </div>
          <div class="spec">
            <b>${o.paper_size}</b> · ${o.color_mode === "bw" ? "黑白" : "彩色"} ·
            ${o.total_pages}页 × ${o.copies}份 ·
            ${o.double_sided ? "双面" : "单面"}
            ${o.plastic_cover ? " · 过胶" : ""}
          </div>
          ${o.customer_phone
            ? `<button type="button" class="phone-link" data-phone="${o.customer_phone}" data-oid="${shortId}">📞 ${o.customer_phone} · 发WhatsApp →</button>`
            : `<div class="phone-none">📞 未留电话</div>`}

          ${renderFiles(o.files)}

          <div class="checklist">
            <label><input type="checkbox" class="chk" data-id="${o.id}" data-field="paid" ${o.paid ? "checked" : ""}> 已收款</label>
            <label><input type="checkbox" class="chk" data-id="${o.id}" data-field="printed" ${o.printed ? "checked" : ""}> 已打印</label>
            <label><input type="checkbox" class="chk" data-id="${o.id}" data-field="collected" ${o.collected ? "checked" : ""}> 已取件</label>
          </div>

          <div class="card-actions">
            <button type="button" class="receipt-btn" data-id="${o.id}">🧾 开收据</button>
            <button type="button" class="delete-btn" data-id="${o.id}">🗑 删除订单</button>
          </div>
        </div>
      `;
    }).join("");
  }

  // ---- delegated events (list is re-rendered often, bind once) ----
  list.addEventListener("click", async (e) => {
    const dlBtn = e.target.closest(".dl-btn");
    if (dlBtn) {
      dlBtn.disabled = true;
      const orig = dlBtn.textContent;
      dlBtn.textContent = "下载中...";
      try {
        const res = await fetch(dlBtn.dataset.url);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = dlBtn.dataset.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
        markDownloaded(dlBtn.dataset.url);
        render();
      } catch (err) {
        alert("下载失败: " + err.message);
      } finally {
        dlBtn.disabled = false;
        dlBtn.textContent = orig;
      }
      return;
    }

    const phoneBtn = e.target.closest(".phone-link");
    if (phoneBtn) {
      const phone = normalizePhone(phoneBtn.dataset.phone);
      const msg = `Hai! Pesanan cetakan anda di KEDAI 19 (#${phoneBtn.dataset.oid}) dah siap dicetak. Boleh datang ambil bila-bila masa.`;
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
      return;
    }

    const receiptBtn = e.target.closest(".receipt-btn");
    if (receiptBtn) {
      const o = orders.find(x => x.id === receiptBtn.dataset.id);
      if (!o) return;
      document.getElementById("receiptArea").innerHTML = buildReceiptHtml(o);
      window.print();
      return;
    }

    const deleteBtn = e.target.closest(".delete-btn");
    if (deleteBtn) {
      const id = deleteBtn.dataset.id;
      const o = orders.find(x => x.id === id);
      if (!o) return;
      const ok = confirm(`确定要删除订单 #${id.slice(0,8).toUpperCase()} 吗？\n这个动作无法复原（文件和记录都会删掉）。`);
      if (!ok) return;

      deleteBtn.disabled = true;
      deleteBtn.textContent = "删除中...";

      // 先尽量把storage里的文件也清掉，失败也不影响下面删记录
      try {
        const paths = (o.files || []).map(f => {
          const idx = f.url.indexOf("/print-uploads/");
          return idx >= 0 ? f.url.slice(idx + "/print-uploads/".length) : null;
        }).filter(Boolean);
        if (paths.length) await sb.storage.from("print-uploads").remove(paths);
      } catch (err) {
        console.error("清理文件失败", err);
      }

      const { data: delData, error } = await sb.from("print_orders").delete().eq("id", id).select();
      if (error) {
        alert("删除失败: " + error.message);
        deleteBtn.disabled = false;
        deleteBtn.textContent = "🗑 删除订单";
        return;
      }
      if (!delData || delData.length === 0) {
        alert("删除没有生效——数据库权限(RLS)可能还没开放delete，请在Supabase跑一下delete policy的SQL。");
        deleteBtn.disabled = false;
        deleteBtn.textContent = "🗑 删除订单";
        return;
      }
      orders = orders.filter(x => x.id !== id);
      render();
      return;
    }
  });

  list.addEventListener("change", async (e) => {
    const chk = e.target.closest(".chk");
    if (!chk) return;
    const id = chk.dataset.id;
    const field = chk.dataset.field;
    const value = chk.checked;
    const o = orders.find(x => x.id === id);
    if (!o) return;

    const updates = { [field]: value };
    // 取件了一定代表已经打印过；取消打印勾选时，取件也要跟着取消
    if (field === "collected" && value) updates.printed = true;
    if (field === "printed" && !value && o.collected) updates.collected = false;

    Object.assign(o, updates);
    render();

    const { error } = await sb.from("print_orders").update(updates).eq("id", id);
    if (error) { alert("更新失败: " + error.message); }
  });

  // 每 20 秒自动刷新一次，看有没有新单
  setInterval(() => {
    if (!document.getElementById("app").classList.contains("hidden")) loadOrders();
  }, 20000);
</script>

</body>
</html>
