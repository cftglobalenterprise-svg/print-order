<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打印订单管理 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E6; --paper-deep:#EDE7D6; --line:#C9BFA8;
    --ink:#221F1A; --ink-soft:#6B6354;
    --stamp:#C1432A; --carbon:#D8A230;
    --paid:#4B7A51; --paid-bg:#E7EFE4;
    --printed:#3D6FA6; --printed-bg:#E4EDF5;
    --collected:#6B6354; --collected-bg:#E8E4D8;
    --wa:#3FA046;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper-deep); color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    padding:16px;
  }
  header{
    max-width:900px; margin:0 auto 16px;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  header h1{ font-family:'IBM Plex Mono', monospace; font-size:18px; margin:0; }
  header .count{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }

  .filters{
    max-width:900px; margin:0 auto 14px;
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .filters button{
    font-family:'IBM Plex Mono', monospace; font-size:12px;
    padding:6px 12px; border:1.3px solid var(--ink); background:transparent;
    color:var(--ink); cursor:pointer;
  }
  .filters button.active{ background:var(--ink); color:var(--paper); }

  .list{ max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }

  .card{
    background:var(--paper); border:1.3px solid var(--ink);
    padding:14px 16px;
  }
  .card.is-collected{ opacity:0.6; }
  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:10px; margin-bottom:8px;
  }
  .oid{ font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:700; }
  .time{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }
  .price{ font-family:'IBM Plex Mono', monospace; font-size:18px; font-weight:700; color:var(--stamp); flex-shrink:0; }

  .badges{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom:2px; }

  .spec{ font-size:13px; margin:8px 0; line-height:1.6; }
  .spec b{ font-weight:600; }

  .phone-link{
    font-family:'IBM Plex Mono', monospace; font-size:12.5px;
    background:none; border:none; padding:0; cursor:pointer;
    color:var(--wa); text-decoration:underline; text-align:left;
  }
  .phone-none{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-soft); }

  .file-group{ margin-top:10px; }
  .file-group-title{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    color:var(--ink-soft); letter-spacing:0.04em;
    margin-bottom:4px;
  }
  .file-row-line{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 0; border-bottom:1px dashed var(--line);
    gap:8px;
  }
  .file-row-line.downloaded{ opacity:0.55; }
  .file-row-line:last-child{ border-bottom:none; }
  .file-row-line-name{
    font-family:'IBM Plex Mono', monospace; font-size:12px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .file-row-line-pages{ color:var(--ink-soft); }
  .dl-check{ color:var(--paid); margin-right:4px; }
  .dl-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px;
    background:var(--paper-deep); border:1.3px solid var(--ink);
    padding:4px 9px; cursor:pointer; color:var(--ink); flex-shrink:0;
  }
  .dl-btn:active{ background:var(--ink); color:var(--paper); }
  .dl-btn:disabled{ opacity:0.5; cursor:default; }
  .dl-btn.done{
    background:transparent; border-color:var(--line); color:var(--ink-soft);
  }

  .checklist{
    display:flex; gap:16px; flex-wrap:wrap; align-items:center;
    margin-top:12px; padding-top:10px; border-top:1px solid rgba(201,191,168,0.6);
  }
  .checklist label{
    display:flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; cursor:pointer;
  }
  .checklist input[type=checkbox]{
    width:16px; height:16px; accent-color: var(--ink); cursor:pointer;
  }

  .badge{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    padding:3px 8px; border-radius:2px; font-weight:600;
  }
  .badge.quick{ background:#F3E3D0; color:var(--stamp); }
  .badge.pay-online{ background:#F3E3D0; color:#B57A17; }
  .badge.pay-store{ background:#F3E3D0; color:#B57A17; }
  .badge.pay-done{ background:var(--paid-bg); color:var(--paid); }
  .badge.printed-badge{ background:var(--printed-bg); color:var(--printed); }
  .badge.collected-badge{ background:var(--collected-bg); color:var(--collected); }

  .empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; font-size:13px; }

  .gate{
    max-width:320px; margin:120px auto; text-align:center;
  }
  .gate h2{ font-family:'IBM Plex Mono', monospace; }
  .gate input{
    width:100%; padding:10px; font-size:16px; text-align:center;
    border:1.3px solid var(--ink); background:var(--paper); margin-bottom:10px;
    letter-spacing:0.2em;
  }
  .gate button{
    width:100%; padding:12px; font-family:'IBM Plex Mono', monospace;
    background:var(--ink); color:var(--paper); border:none; cursor:pointer;
  }
  .gate .err{ color:var(--stamp); font-size:12px; margin-top:8px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2>🔒 员工专用</h2>
  <input type="password" id="pin" placeholder="PIN" inputmode="numeric">
  <button id="gateBtn">进入</button>
  <div class="err hidden" id="gateErr">PIN 不对</div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>🖨️ 打印订单 ORDERS</h1>
    <span class="count" id="countLabel"></span>
  </header>
  <div class="filters" id="filters">
    <button data-f="all" class="active">全部</button>
    <button data-f="pending">待处理</button>
    <button data-f="printed">已打印待取</button>
    <button data-f="collected">已取件</button>
  </div>
  <div class="list" id="list"></div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://bkunpzbovsetqdtjlwmf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_-1Hhh1o7Uv4qQNb1NKCKew_7UuG4qpT";
  const ADMIN_PIN = "1234"; // 先用这个测试，之后想改就改这行

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.getElementById("gateBtn").addEventListener("click", tryEnter);
  document.getElementById("pin").addEventListener("keydown", e => { if (e.key === "Enter") tryEnter(); });
  function tryEnter() {
    const val = document.getElementById("pin").value;
    if (val === ADMIN_PIN) {
      sessionStorage.setItem("po_admin_ok", "1");
      document.getElementById("gate").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      loadOrders();
    } else {
      document.getElementById("gateErr").classList.remove("hidden");
    }
  }
  if (sessionStorage.getItem("po_admin_ok") === "1") {
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    loadOrders();
  }

  let orders = [];
  let currentFilter = "all";
  const list = document.getElementById("list");

  const downloadedSet = new Set(JSON.parse(localStorage.getItem("po_downloaded") || "[]"));
  function markDownloaded(url) {
    downloadedSet.add(url);
    localStorage.setItem("po_downloaded", JSON.stringify([...downloadedSet]));
  }

  document.querySelectorAll("#filters button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.f;
      render();
    });
  });

  async function loadOrders() {
    const { data, error } = await sb
      .from("print_orders")
      .select("*")
      .order("created_at", { ascending: false });
    if (error) { alert("加载失败: " + error.message); return; }
    orders = data;
    render();
  }

  // ---- helpers ----
  function rank(o) {
    if (o.collected) return 2;
    if (o.printed) return 1;
    return 0;
  }
  function matchesFilter(o) {
    if (currentFilter === "all") return true;
    if (currentFilter === "pending") return !o.printed && !o.collected;
    if (currentFilter === "printed") return o.printed && !o.collected;
    if (currentFilter === "collected") return !!o.collected;
    return true;
  }
  function categorize(name) {
    const ext = (name.split(".").pop() || "").toLowerCase();
    if (ext === "pdf") return "PDF";
    if (["jpg","jpeg","png","gif","webp","heic"].includes(ext)) return "图片";
    if (["doc","docx"].includes(ext)) return "Word 文档";
    return "其他文件";
  }
  function renderFiles(files) {
    const groups = {};
    (files || []).forEach(f => {
      const cat = categorize(f.name);
      (groups[cat] = groups[cat] || []).push(f);
    });
    const order = ["PDF", "图片", "Word 文档", "其他文件"];
    return order.filter(cat => groups[cat]).map(cat => `
      <div class="file-group">
        <div class="file-group-title">${cat} · ${groups[cat].length}个</div>
        ${groups[cat].map(f => {
          const done = downloadedSet.has(f.url);
          return `
          <div class="file-row-line ${done ? "downloaded" : ""}">
            <span class="file-row-line-name">${done ? '<span class="dl-check">✓</span>' : ''}${f.name} <span class="file-row-line-pages">(${f.pages}页)</span></span>
            <button type="button" class="dl-btn ${done ? "done" : ""}" data-url="${f.url}" data-name="${f.name}">${done ? "↻ 重新下载" : "⬇ 下载"}</button>
          </div>
        `;
        }).join("")}
      </div>
    `).join("");
  }
  function normalizePhone(raw) {
    let digits = raw.replace(/\D/g, "");
    if (digits.startsWith("60")) return digits;
    if (digits.startsWith("0")) return "60" + digits.slice(1);
    return "60" + digits;
  }
  function paymentBadge(o) {
    if (o.paid) return `<span class="badge pay-done">✓ 已收款</span>`;
    if (o.payment_method === "online_claimed") return `<span class="badge pay-online">💳 待核实付款</span>`;
    return `<span class="badge pay-store">🏪 到店付款(未收)</span>`;
  }

  function render() {
    const filtered = orders.filter(matchesFilter).sort((a, b) => {
      const r = rank(a) - rank(b);
      if (r !== 0) return r;
      return new Date(b.created_at) - new Date(a.created_at);
    });
    document.getElementById("countLabel").textContent = `共 ${filtered.length} 单`;

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty">暂时没有订单</div>`;
      return;
    }

    list.innerHTML = filtered.map(o => {
      const t = new Date(o.created_at).toLocaleString("zh-CN", { dateStyle: "short", timeStyle: "short" });
      const shortId = o.id.slice(0,8).toUpperCase();
      return `
        <div class="card ${o.collected ? "is-collected" : ""}">
          <div class="card-top">
            <div>
              <span class="oid">#${shortId}</span>
              <div class="badges">
                ${paymentBadge(o)}
                ${o.printed ? '<span class="badge printed-badge">🖨 已打印</span>' : ''}
                ${o.collected ? '<span class="badge collected-badge">📦 已取件</span>' : ''}
                ${o.notes ? '<span class="badge quick">⚡ 待确认</span>' : ''}
              </div>
              <div class="time">${t}</div>
            </div>
            <div class="price">RM ${Number(o.price).toFixed(2)}</div>
          </div>
          <div class="spec">
            <b>${o.paper_size}</b> · ${o.color_mode === "bw" ? "黑白" : "彩色"} ·
            ${o.total_pages}页 × ${o.copies}份 ·
            ${o.double_sided ? "双面" : "单面"}
            ${o.plastic_cover ? " · 过胶" : ""}
          </div>
          ${o.customer_phone
            ? `<button type="button" class="phone-link" data-phone="${o.customer_phone}" data-oid="${shortId}">📞 ${o.customer_phone} · 发WhatsApp →</button>`
            : `<div class="phone-none">📞 未留电话</div>`}

          ${renderFiles(o.files)}

          <div class="checklist">
            <label><input type="checkbox" class="chk" data-id="${o.id}" data-field="paid" ${o.paid ? "checked" : ""}> 已收款</label>
            <label><input type="checkbox" class="chk" data-id="${o.id}" data-field="printed" ${o.printed ? "checked" : ""}> 已打印</label>
            <label><input type="checkbox" class="chk" data-id="${o.id}" data-field="collected" ${o.collected ? "checked" : ""}> 已取件</label>
          </div>
        </div>
      `;
    }).join("");
  }

  // ---- delegated events (list is re-rendered often, bind once) ----
  list.addEventListener("click", async (e) => {
    const dlBtn = e.target.closest(".dl-btn");
    if (dlBtn) {
      dlBtn.disabled = true;
      const orig = dlBtn.textContent;
      dlBtn.textContent = "下载中...";
      try {
        const res = await fetch(dlBtn.dataset.url);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = dlBtn.dataset.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
        markDownloaded(dlBtn.dataset.url);
        render();
      } catch (err) {
        alert("下载失败: " + err.message);
      } finally {
        dlBtn.disabled = false;
        dlBtn.textContent = orig;
      }
      return;
    }

    const phoneBtn = e.target.closest(".phone-link");
    if (phoneBtn) {
      const phone = normalizePhone(phoneBtn.dataset.phone);
      const msg = `Hai! Pesanan cetakan anda di KEDAI 19 (#${phoneBtn.dataset.oid}) dah siap dicetak. Boleh datang ambil bila-bila masa.`;
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
      return;
    }
  });

  list.addEventListener("change", async (e) => {
    const chk = e.target.closest(".chk");
    if (!chk) return;
    const id = chk.dataset.id;
    const field = chk.dataset.field;
    const value = chk.checked;
    const o = orders.find(x => x.id === id);
    if (!o) return;

    const updates = { [field]: value };
    // 取件了一定代表已经打印过；取消打印勾选时，取件也要跟着取消
    if (field === "collected" && value) updates.printed = true;
    if (field === "printed" && !value && o.collected) updates.collected = false;

    Object.assign(o, updates);
    render();

    const { error } = await sb.from("print_orders").update(updates).eq("id", id);
    if (error) { alert("更新失败: " + error.message); }
  });

  // 每 20 秒自动刷新一次，看有没有新单
  setInterval(() => {
    if (!document.getElementById("app").classList.contains("hidden")) loadOrders();
  }, 20000);
</script>

</body>
</html>
